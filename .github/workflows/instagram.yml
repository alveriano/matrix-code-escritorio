name: Números do Instagram e do YouTube

on:
  schedule:
    - cron: "2-59/5 * * * *"  # o GitHub não aceita menos de 5 minutos
  workflow_dispatch:

permissions: {}

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Buscar no Windsor e gravar no Supabase
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 scripts/instagram.py
      - name: Buscar no YouTube e gravar no Supabase
        if: ${{ !cancelled() }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 scripts/youtube.py
