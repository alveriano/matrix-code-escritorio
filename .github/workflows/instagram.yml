name: Números do Instagram

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Buscar no Windsor e gravar no Supabase
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 scripts/instagram.py
